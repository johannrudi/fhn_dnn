description: "Options for DNN-based inverse maps"

data:
    data_dir: "../data/2020-12-09"  # relative path to data directory
    features_normalize: False       # scale features to have zero mean and unit std
    targets_normalize: False        # scale targets to have zero mean and unit std
    # use encoder network of an autoencoder
    # autoencoder_load_dir: 'runs/ae'
    # autoencoder_latent_size: 16  # e.g., 2, 4, 16, 64, 125
    # num_features: [1, 16]  # adjust to AE latent size

data_train:
    features_type: 'TIME_NOISE'     # 'TIME', 'TIME_NOISE', 'RATE_DURATION'/'ODE_STATS', 'NOISE'
    features_use_channels_range: [0, 1]
    features_sub_length: 800        # use sub interval of this size
    features_sub_step: 1            # subsample by this step size
    features_sub_begin_random: True # flag to pick a sub interval at random
    # features_sub_begin_sequence: [0, 100, 200]  # choices to begin sub intervals
    features_additive_noise_std: 0  # add i.i.d. noise
    # features_fft: True              # concatenate features with their FFT (needs setting of `num_features`)
    # num_features: [3, 500]
    targets_type: 'ODE'             # 'ODE', 'ODE_NOISE', 'NOISE'
    Ntrain:    1024
    Nvalidate: 1000
    train_shuffle_buffer_size: 1024
    train_batch_size: 128

data_evaluate:
    features_type: 'TIME_NOISE'     # 'TIME', 'TIME_NOISE', 'RATE_DURATION'/'ODE_STATS', 'NOISE'
    features_use_channels_range: [0, 1]
    features_sub_length: 800        # use sub interval of this size
    features_sub_step: 1            # subsample by this step size
    features_sub_begin_sequence: [0, 100, 200]  # choices to begin sub intervals
    features_additive_noise_std: 0  # add i.i.d. noise
    # features_fft: True              # concatenate features with their FFT (needs setting of `num_features`)
    # num_features: [3, 500]
    targets_type: 'ODE'             # 'ODE', 'ODE_NOISE', 'NOISE'
    Ntest: 2000
    eval_batch_size: 128

dataloader:
    item_return_order: "yx"
    num_workers: 1            # optional; omit or set null to auto-detect from CPU/accelerator
    prefetch_factor: 2        # optional; only used when num_workers > 0

net:
#   type: 'MLPNet'
#   dense_layer_sizes:
#       - 128
#       - 128
#       - 128
#       - 128
#   activation_fn: 'gelu'  # 'relu', 'silu' or 'swish', 'gelu'

#   type: 'MLPResNet'
#   residual_blocks_sizes:
#       - [32, 32, 128, 32]
#       - [32, 32, 128, 32]
#       - [32, 32, 128, 32]
#       - [32, 32, 128, 32]
#   activation_fn: 'gelu'  # 'relu', 'silu' or 'swish', 'gelu'

    type: 'ConvNet'
    conv_layer_kernel: 3
    conv_layer_sizes:
        - 8
        - 16
        - 32
    dense_layer_sizes:
        - 128
        - 128
        - 128
        - 128
    activation_fn: 'gelu'  # 'relu', 'silu' or 'swish', 'gelu'

#   type: 'ConvResNet'
#   conv_layer_kernel: 3
#   conv_layer_padding: 1
#   conv_layer_sizes:
#       - 8
#       - 8
#       - 8
#       - 8
#   residual_blocks_sizes:
#       - [32, 32, 128, 32]
#       - [32, 32, 128, 32]
#       - [32, 32, 128, 32]
#       - [32, 32, 128, 32]
#   activation_fn: 'gelu'  # 'relu', 'silu' or 'swish', 'gelu'

#   type: 'EfficientNet'
#   dropout: 0.0

#   type: 'TransformerNet'
#   embedding_size: 128
#   attention_layers_n_heads:
#       - 8
#       - 8
#       - 8
#       - 8
#       - 8
#       - 8
#   patch_size: 50
#   dropout: 0.0

optimizer:
    type: 'AdamW'  # 'Adam', 'AdamW'
    learning_rate: 1.0e-2
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.01  # used in AdamW
    learning_rate_scheduler: # commented values below means to use defaults
        init_learning_rate:  #1.0e-3
        linear_epochs:       #50  # num epochs to get from `init_learning_rate` to `learning_rate`
        constant_epochs:     #50  # num epochs to stay at `learning_rate`
        final_learning_rate: #1.0e-4

training:
    epochs: 400
    # compile:
    #     mode: "reduce-overhead"  # "default", "reduce-overhead" (CUDA graphs), "max-autotune", "max-autotune-no-cudagraphs"
    #     fullgraph: False         # error out instead of falling back on graph breaks
    #     dynamic:                 # empty (auto), True, or False (static shapes)
    # profile_skip_first: 8        # untraced steps before profiling (e.g., use 8 when compile is enabled)
    # autocast_dtype = bfloat16    # use mixed precision

runconfig:
    load_checkpoint: #'runs/dnn_fhn2020/checkpoints/<folder>/net_e<epoch>.pt'
    save_dir:  'runs/dnn_fhn2020'
    log_epochs: 1
    save_checkpoints_epochs: 50
    debug: True
    random_seed: 123
    show_plots: False
